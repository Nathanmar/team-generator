openapi: 3.0.3
info:
  title: Squad Generator API
  version: 1.0.0
  description: |
    Contrat d'API OpenAPI 3.0.3 pour le projet Group Generator (M2).
servers:
  - url: http://localhost:3000
    description: Serveur de développement local (Bun / Hono)

tags:
  - name: Members
    description: Gestion des personnes inscrites et de leurs niveaux par technologie
  - name: Groups
    description: Génération et consultation des groupes équilibrés
  - name: Technos
    description: Référentiel des technologies avec leur catégorie (front / back / fullstack)

paths:
  # ==========================================
  # ENTITÉ : MEMBERS (PERSONNES & NIVEAUX)
  # ==========================================
  /members:
    get:
      tags:
        - Members
      summary: Lister les personnes
      description: Récupère la liste de toutes les personnes avec leurs compétences et leur spécialité déduite.
      responses:
        '200':
          description: Liste des personnes récupérée avec succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
              example:
                - id: 1
                  name: Dupont
                  first_name: Jean
                  speciality: front
                  technos:
                    - techno_id: 1
                      name: React
                      type: front
                      level: 4
                    - techno_id: 2
                      name: Hono
                      type: back
                      level: 2
                - id: 2
                  name: Martin
                  first_name: Alice
                  speciality: back
                  technos:
                    - techno_id: 2
                      name: Hono
                      type: back
                      level: 5
                    - techno_id: 3
                      name: PostgreSQL
                      type: back
                      level: 4
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Members
      summary: Inscrire une personne avec ses niveaux de technos
      description: |
        Enregistre une nouvelle personne en base. Le front transmet les technologies sélectionnées
        accompagnées du niveau d'aisance / note attribuée (de 1 à 5).
      requestBody:
        required: true
        description: Données de la personne et liste de ses technologies notées.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
            example:
              name: Dupont
              first_name: Jean
              technos:
                - techno_id: 1
                  level: 4
                - techno_id: 2
                  level: 2
      responses:
        '201':
          description: Personne enregistrée avec succès (spécialité front/back calculée par le back).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              example:
                id: 1
                name: Dupont
                first_name: Jean
                speciality: front
                technos:
                  - techno_id: 1
                    name: React
                    type: front
                    level: 4
                  - techno_id: 2
                    name: Hono
                    type: back
                    level: 2
        '400':
          $ref: '#/components/responses/BadRequestError'
        '422':
          description: Échec de validation Zod (ex. niveau hors intervalle 1-5, techno inexistante, nom manquant).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Validation failed
                message: Techno level must be between 1 and 5
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identifiant numérique unique de la personne.
        schema:
          type: integer
        example: 1

    get:
      tags:
        - Members
      summary: Consulter une personne
      description: Récupère le profil détaillé d'une personne avec toutes ses compétences notées.
      responses:
        '200':
          description: Profil de la personne trouvé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              example:
                id: 1
                name: Dupont
                first_name: Jean
                speciality: front
                technos:
                  - techno_id: 1
                    name: React
                    type: front
                    level: 4
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: Personne introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Not found
                message: Member not found
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Members
      summary: Modifier une personne ou ses niveaux
      description: Met à jour les informations d'une personne ou ajuste ses niveaux de technos.
      requestBody:
        required: true
        description: Champs partiels à mettre à jour.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdateInput'
            example:
              first_name: Pierre
              technos:
                - techno_id: 1
                  level: 5
      responses:
        '200':
          description: Personne mise à jour avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              example:
                id: 1
                name: Dupont
                first_name: Pierre
                speciality: front
                technos:
                  - techno_id: 1
                    name: React
                    type: front
                    level: 5
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: Personne introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Not found
                message: Member not found
        '422':
          description: Données invalides selon Zod.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Validation failed
                message: Level must be an integer between 1 and 5
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Members
      summary: Supprimer une personne
      description: Supprime définitivement une personne et ses notes associées en base.
      responses:
        '204':
          description: Personne supprimée avec succès.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: Personne introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Not found
                message: Member not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # ENTITÉ : GROUPS (GÉNÉRATION INTELLIGENTE)
  # ==========================================
  /groups:
    get:
      tags:
        - Groups
      summary: Lister les groupes formés
      description: Récupère la liste de toutes les équipes formées lors du dernier tirage.
      responses:
        '200':
          description: Liste des équipes récupérée avec succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
              example:
                - id: 1
                  group_name: Squad Alpha
                  capacity: 3
                  group_level: 4
                  members: [1, 2, 3]
                - id: 2
                  group_name: Squad Beta
                  capacity: 3
                  group_level: 4
                  members: [4, 5, 6]
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Groups
      summary: Réinitialiser les groupes
      description: Supprime tous les groupes existants afin de pouvoir relancer un nouveau tirage propre.
      responses:
        '204':
          description: Réinitialisation des groupes effectuée.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /groups/generate/{capacity}:
    parameters:
      - name: capacity
        in: path
        required: true
        description: Nombre de personnes par équipe (capacité N).
        schema:
          type: integer
          minimum: 1
        example: 3

    post:
      tags:
        - Groups
      summary: Générer les équipes de N personnes
      description: |
        Endpoint central de l'application : forme des groupes équilibrés en utilisant
        les notes par technologie (répartition équilibrée front / back).
      responses:
        '201':
          description: Groupes générés et enregistrés avec succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
              example:
                - id: 1
                  group_name: Squad Alpha
                  capacity: 3
                  group_level: 4
                  members: [1, 2, 3]
                - id: 2
                  group_name: Squad Beta
                  capacity: 3
                  group_level: 4
                  members: [4, 5, 6]
        '400':
          description: Capacité invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Bad request
                message: Capacity must be a positive integer
        '422':
          description: Pas assez de personnes inscrites pour former des équipes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Validation failed
                message: Not enough registered members to generate groups
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # ENTITÉ : TECHNOS (RÉFÉRENTIEL AVEC FLAG FRONT/BACK/FULLSTACK)
  # ==========================================
  /technos:
    get:
      tags:
        - Technos
      summary: Lister les technologies disponibles
      description: |
        Récupère toutes les technologies avec leur catégorie (front, back ou fullstack).
        Permet au front d'afficher la sélection des technologies lors de l'inscription.
      responses:
        '200':
          description: Liste des technologies récupérée avec succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Techno'
              example:
                - id: 1
                  name: React
                  type: front
                - id: 2
                  name: Hono
                  type: back
                - id: 3
                  name: TypeScript
                  type: fullstack
                - id: 4
                  name: PostgreSQL
                  type: back
        '500':
          $ref: '#/components/responses/InternalServerError'

# ==========================================
# COMPOSANTS & SCHÉMAS (ZOD-FRIENDLY)
# ==========================================
components:
  schemas:
    Techno:
      type: object
      description: Technologie avec son positionnement Front, Back ou Fullstack.
      required:
        - id
        - name
        - type
      properties:
        id:
          type: integer
          description: Identifiant unique de la technologie.
          example: 1
        name:
          type: string
          description: Libellé de la technologie.
          example: React
        type:
          type: string
          enum: [front, back, fullstack]
          description: Catégorie de la technologie (front, back ou fullstack).
          example: front

    MemberTechnoInput:
      type: object
      description: Association d'une technologie sélectionnée et de la note de niveau attribuée (Table Level).
      required:
        - techno_id
        - level
      properties:
        techno_id:
          type: integer
          description: ID de la technologie choisie.
          example: 1
        level:
          type: integer
          minimum: 1
          maximum: 5
          description: Niveau de maîtrise auto-évalué de 1 (débutant) à 5 (expert).
          example: 4

    MemberTechnoDetail:
      type: object
      description: Détail d'une compétence d'un membre renvoyé par l'API (avec nom et type pour l'affichage front).
      required:
        - techno_id
        - name
        - type
        - level
      properties:
        techno_id:
          type: integer
          example: 1
        name:
          type: string
          example: React
        type:
          type: string
          enum: [front, back, fullstack]
          example: front
        level:
          type: integer
          example: 4

    Member:
      type: object
      description: Personne enregistrée avec ses niveaux et son profil calculé.
      required:
        - id
        - name
        - first_name
        - speciality
        - technos
      properties:
        id:
          type: integer
          description: Identifiant unique en base.
          example: 1
        name:
          type: string
          description: Nom de famille.
          example: Dupont
        first_name:
          type: string
          description: Prénom.
          example: Jean
        speciality:
          type: string
          enum: [front, back, fullstack]
          description: Profil déduit par le serveur selon la moyenne des notes front vs back.
          example: front
        technos:
          type: array
          description: Liste détaillée des technologies et niveaux du membre.
          items:
            $ref: '#/components/schemas/MemberTechnoDetail'

    MemberInput:
      type: object
      description: Payload d'inscription d'une personne envoyé par le formulaire front.
      required:
        - name
        - first_name
        - technos
      properties:
        name:
          type: string
          description: Nom de famille.
          example: Dupont
        first_name:
          type: string
          description: Prénom.
          example: Jean
        technos:
          type: array
          description: Technologies choisies et niveaux associés (1 à 5).
          items:
            $ref: '#/components/schemas/MemberTechnoInput'
          example:
            - techno_id: 1
              level: 4
            - techno_id: 2
              level: 2

    MemberUpdateInput:
      type: object
      description: Données modifiables d'une personne.
      properties:
        name:
          type: string
          example: Dupont
        first_name:
          type: string
          example: Pierre
        technos:
          type: array
          items:
            $ref: '#/components/schemas/MemberTechnoInput'
          example:
            - techno_id: 1
              level: 5

    Group:
      type: object
      description: Équipe formée lors de la génération.
      required:
        - id
        - group_name
        - capacity
        - group_level
        - members
      properties:
        id:
          type: integer
          description: Identifiant unique du groupe.
          example: 1
        group_name:
          type: string
          description: Nom attribué à l'équipe.
          example: Squad Alpha
        capacity:
          type: integer
          description: Nombre de personnes cibles.
          example: 3
        group_level:
          type: integer
          description: Moyenne globale des niveaux de l'équipe.
          example: 4
        members:
          type: array
          description: Liste des IDs des personnes affectées à cette équipe.
          items:
            type: integer
          example: [1, 2, 3]

    ErrorResponse:
      type: object
      description: Format d'erreur standardisé de l'API.
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Intitulé court de l'erreur.
          example: Bad request
        message:
          type: string
          description: Message d'erreur explicatif.
          example: Invalid parameter provided

  responses:
    BadRequestError:
      description: Requête mal formée ou paramètre invalide (400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Bad request
            message: Invalid ID format provided

    InternalServerError:
      description: Erreur interne inattendue du serveur (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Internal server error
            message: An unexpected internal error occurred