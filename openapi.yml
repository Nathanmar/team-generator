openapi: 3.0.3
info:
  title: Squad Generator API
  version: 1.0.0
  description: |
    Contrat d'API OpenAPI 3.0.3 pour le projet Group Generator (M2).
    
    **Contexte & Objectif :**
    Application web qui génère des groupes aléatoires à partir des personnes enregistrées en base.
    Permet d'ajouter une personne et de choisir le nombre de personnes par groupe pour former les équipes du semestre.

    **Squad :**
    - 2 Développeurs Back-end
    - 2 Développeurs Front-end
    - 1 Garant du contrat

    **Stack technique convenue :**
    - Runtime : Bun
    - Back-end : Hono + Zod
    - Front-end : React

    **Pacte d'équipe :**
    - Aucune ligne de code d'implémentation avant validation formelle par les 5 membres de la squad.
servers:
  - url: http://localhost:3000
    description: Serveur de développement local (Bun / Hono)

tags:
  - name: Members
    description: Gestion des personnes enregistrées (CRUD complet)
  - name: Groups
    description: Génération et gestion des groupes / équipes
  - name: Technos
    description: Référentiel des technologies pour les filtres et sélecteurs
  - name: Specialities
    description: Référentiel des spécialités pour les formulaires

paths:
  # ==========================================
  # ENTITÉ : MEMBERS (PERSONNES)
  # ==========================================
  /members:
    get:
      tags:
        - Members
      summary: Lister les personnes
      description: Récupère la liste de toutes les personnes enregistrées en base de données.
      responses:
        '200':
          description: Liste des personnes récupérée avec succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
              example:
                - id: 1
                  name: Dupont
                  first_name: Jean
                  technos: [1, 2]
                  speciality_id: 1
                - id: 2
                  name: Martin
                  first_name: Alice
                  technos: [2]
                  speciality_id: 2
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Members
      summary: Ajouter une personne
      description: Enregistre une nouvelle personne dans la base.
      requestBody:
        required: true
        description: Données de la personne à créer.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
            example:
              name: Dupont
              first_name: Jean
              technos: [1, 2]
              speciality_id: 1
      responses:
        '201':
          description: Personne créée avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              example:
                id: 1
                name: Dupont
                first_name: Jean
                technos: [1, 2]
                speciality_id: 1
        '400':
          $ref: '#/components/responses/BadRequestError'
        '422':
          description: Échec de validation Zod (champ manquant ou données invalides).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Validation failed
                message: Invalid speciality_id
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identifiant numérique unique de la personne.
        schema:
          type: integer
        example: 1

    get:
      tags:
        - Members
      summary: Consulter une personne
      description: Récupère le profil détaillé d'une personne par son identifiant.
      responses:
        '200':
          description: Détails de la personne trouvée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              example:
                id: 1
                name: Dupont
                first_name: Jean
                technos: [1, 2]
                speciality_id: 1
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: Personne introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Not found
                message: Member not found
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Members
      summary: Modifier une personne
      description: Met à jour partiellement les informations d'une personne existante.
      requestBody:
        required: true
        description: Champs de la personne à modifier.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdateInput'
            example:
              first_name: Pierre
              speciality_id: 3
      responses:
        '200':
          description: Personne mise à jour avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              example:
                id: 1
                name: Dupont
                first_name: Pierre
                technos: [1, 2]
                speciality_id: 3
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: Personne introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Not found
                message: Member not found
        '422':
          description: Données de modification invalides selon Zod.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Validation failed
                message: Invalid speciality_id
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Members
      summary: Supprimer une personne
      description: Supprime définitivement une personne de la base.
      responses:
        '204':
          description: Personne supprimée avec succès (aucun contenu retourné).
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: Personne introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Not found
                message: Member not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # ENTITÉ : GROUPS (GROUPES ALÉATOIRES)
  # ==========================================
  /groups:
    get:
      tags:
        - Groups
      summary: Lister les groupes
      description: Récupère la liste de tous les groupes actuellement formés.
      responses:
        '200':
          description: Liste des groupes récupérée avec succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
              example:
                - id: 1
                  group_name: Groupe A
                  capacity: 3
                  group_level: 3
                  members: [1, 2, 3]
                - id: 2
                  group_name: Groupe B
                  capacity: 3
                  group_level: 3
                  members: [4, 5, 6]
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Groups
      summary: Réinitialiser les groupes
      description: Supprime tous les groupes existants afin de pouvoir relancer un nouveau tirage aléatoire propre.
      responses:
        '204':
          description: Tous les groupes ont été supprimés avec succès (réinitialisation effectuée).
        '500':
          $ref: '#/components/responses/InternalServerError'

  /groups/generate/{capacity}:
    parameters:
      - name: capacity
        in: path
        required: true
        description: Nombre souhaité de personnes par groupe (capacité N).
        schema:
          type: integer
          minimum: 1
        example: 3

    post:
      tags:
        - Groups
      summary: Générer des groupes aléatoires de N personnes
      description: |
        Endpoint central du produit : génère automatiquement des groupes aléatoires
        à partir des personnes enregistrées en base, selon la capacité N spécifiée dans l'URL.
        Aucun corps de requête (body) requis.
      responses:
        '201':
          description: Groupes aléatoires générés et enregistrés avec succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
              example:
                - id: 1
                  group_name: Groupe A
                  capacity: 3
                  group_level: 3
                  members: [1, 2, 3]
                - id: 2
                  group_name: Groupe B
                  capacity: 3
                  group_level: 3
                  members: [4, 5, 6]
        '400':
          description: Paramètre de capacité invalide (ex. valeur négative ou non numérique).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Bad request
                message: Capacity must be a positive integer
        '422':
          description: Règle métier non satisfaite (ex. nombre total de personnes insuffisant pour former des groupes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Validation failed
                message: Not enough registered members to generate groups
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # ENTITÉ : TECHNOS (RÉFÉRENTIEL)
  # ==========================================
  /technos:
    get:
      tags:
        - Technos
      summary: Lister les technologies
      description: Récupère la liste des technologies disponibles pour alimenter les listes déroulantes du front-end.
      responses:
        '200':
          description: Liste des technologies récupérée avec succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Techno'
              example:
                - id: 1
                  name: React
                - id: 2
                  name: TypeScript
                - id: 3
                  name: Hono
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # ENTITÉ : SPECIALITIES (RÉFÉRENTIEL)
  # ==========================================
  /specialities:
    get:
      tags:
        - Specialities
      summary: Lister les spécialités
      description: Récupère la liste des spécialités disponibles pour alimenter les formulaires du front-end.
      responses:
        '200':
          description: Liste des spécialités récupérée avec succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Speciality'
              example:
                - id: 1
                  name: Front-end
                - id: 2
                  name: Back-end
                - id: 3
                  name: Full-stack
        '500':
          $ref: '#/components/responses/InternalServerError'

# ==========================================
# COMPOSANTS & SCHÉMAS (ZOD-FRIENDLY)
# ==========================================
components:
  schemas:
    Member:
      type: object
      description: Représentation complète d'une personne enregistrée.
      required:
        - id
        - name
        - first_name
        - technos
        - speciality_id
      properties:
        id:
          type: integer
          description: Identifiant unique en base.
          example: 1
        name:
          type: string
          description: Nom de famille.
          example: Dupont
        first_name:
          type: string
          description: Prénom.
          example: Jean
        technos:
          type: array
          description: Liste des IDs des technologies maîtrisées.
          items:
            type: integer
          example: [1, 2]
        speciality_id:
          type: integer
          description: ID de la spécialité principale.
          example: 1

    MemberInput:
      type: object
      description: Données requises pour créer une nouvelle personne.
      required:
        - name
        - first_name
        - technos
        - speciality_id
      properties:
        name:
          type: string
          description: Nom de famille.
          example: Dupont
        first_name:
          type: string
          description: Prénom.
          example: Jean
        technos:
          type: array
          description: Liste des IDs des technologies maîtrisées.
          items:
            type: integer
          example: [1, 2]
        speciality_id:
          type: integer
          description: ID de la spécialité principale.
          example: 1

    MemberUpdateInput:
      type: object
      description: Données optionnelles pour mettre à jour une personne existante.
      properties:
        name:
          type: string
          description: Nom de famille.
          example: Dupont
        first_name:
          type: string
          description: Prénom.
          example: Pierre
        technos:
          type: array
          description: Liste des IDs des technologies maîtrisées.
          items:
            type: integer
          example: [1, 2]
        speciality_id:
          type: integer
          description: ID de la spécialité principale.
          example: 3

    Group:
      type: object
      description: Représentation d'une équipe générée.
      required:
        - id
        - group_name
        - capacity
        - group_level
        - members
      properties:
        id:
          type: integer
          description: Identifiant unique du groupe.
          example: 1
        group_name:
          type: string
          description: Nom attribué à l'équipe.
          example: Groupe A
        capacity:
          type: integer
          description: Nombre cible de personnes dans le groupe.
          example: 3
        group_level:
          type: integer
          description: Niveau moyen ou score calculé de l'équipe.
          example: 3
        members:
          type: array
          description: Liste des IDs des personnes membres du groupe.
          items:
            type: integer
          example: [1, 2, 3]

    Techno:
      type: object
      description: Technologie référencée.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: Identifiant unique de la technologie.
          example: 1
        name:
          type: string
          description: Libellé de la technologie.
          example: React

    Speciality:
      type: object
      description: Spécialité référencée.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: Identifiant unique de la spécialité.
          example: 1
        name:
          type: string
          description: Libellé de la spécialité.
          example: Front-end

    ErrorResponse:
      type: object
      description: Format standardisé des erreurs API.
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Intitulé court de l'erreur.
          example: Bad request
        message:
          type: string
          description: Explication détaillée de l'erreur.
          example: Invalid parameter provided

  responses:
    BadRequestError:
      description: Requête mal formée ou paramètre invalide (400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Bad request
            message: Invalid ID format provided

    InternalServerError:
      description: Erreur interne du serveur (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Internal server error
            message: An unexpected internal error occurred