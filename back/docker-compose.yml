services:
  db:
    image: postgres:17-alpine
    container_name: team-generator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: team
      POSTGRES_PASSWORD: team
      POSTGRES_DB: team_generator
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team -d team_generator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
